name: ci

# GitHub-hosted runners only (the repository is public).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-toolchain.toml pins the toolchain; this installs it.
      - run: rustup show active-toolchain
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check licenses advisories sources
  # The Windows installer lifecycle on a disposable runner: silent install,
  # reinstall over a running node, uninstall with the node running (keeps the
  # farm data), upgrade while a process holds crabfarm.exe open (the installer
  # renames it aside), uninstall /DELETEDATA, user PATH identical before and
  # after. scripts/test-installer.ps1 refuses to run on anything but a
  # GitHub-hosted runner.
  installer:
    name: windows installer lifecycle
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - name: Fetch the pinned NSIS
        shell: pwsh
        run: |
          $nsis = ./scripts/fetch-nsis.ps1 -Destination "$env:RUNNER_TEMP/nsis"
          "CRABFARM_MAKENSIS=$nsis" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Package (release build and makensis)
        shell: pwsh
        run: ./scripts/package.ps1 -Jobs 4
      - name: Install, reinstall, upgrade in use, uninstall
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          ./scripts/test-installer.ps1 -Setup "artifacts/installer/crabfarm-$v-setup.exe" -Version $v
  # install.sh against a fake archive: checksums, no profile edits, no sudo.
  install-script:
    name: install.sh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sh -n scripts/install.sh
      - run: sh scripts/test-install-sh.sh
