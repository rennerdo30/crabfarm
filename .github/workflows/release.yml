name: release

# A version tag builds every package and attaches them to a DRAFT GitHub
# release. Publishing the draft is the owner's yes (docs/RELEASING.md);
# nothing here publishes. A tag with "-" (0.2.0-beta.1) becomes a prerelease.
# The crates.io upload is a separate manual workflow (publish-crate.yml).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to build (vX.Y.Z or vX.Y.Z-pre.N)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  # A release is built only from a commit that is on main.
  verify:
    name: tag is on main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The tag is resolved to a commit ONCE, here. Every later job checks out
    # this SHA, so a tag moved after this check (or between jobs) cannot make a
    # job build or release a commit that was never verified (CF-25).
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the tag to a commit
        id: resolve
        run: |
          set -euo pipefail
          sha=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          case "$sha" in
            [0-9a-f]*) ;;
            *) echo "Could not resolve $RELEASE_TAG to a commit" >&2; exit 1 ;;
          esac
          [ "${#sha}" -ge 40 ] || { echo "Unexpected commit id for $RELEASE_TAG" >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Tag commit is an ancestor of origin/main
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$SHA" refs/remotes/origin/main; then
            echo "Tag $RELEASE_TAG (${SHA:0:7}) is not on main; refusing to build a release from it." >&2
            exit 1
          fi

  build:
    name: build (${{ matrix.target }})
    needs: [verify]
    strategy:
      fail-fast: false
      matrix:
        # Every target builds natively on a GitHub-hosted runner; nothing is
        # cross-compiled. Labels checked 2026-11-19 against GitHub's
        # "GitHub-hosted runners" reference (docs.github.com, Standard
        # runners; all free on public repositories): windows-latest,
        # windows-11-arm, ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel,
        # macos-latest. Recheck before each release (docs/RELEASING.md).
        # macos-15-intel is the last Intel Mac label GitHub
        # offers for free; when it goes (announced for 2027), build
        # x86_64-apple-darwin on macos-latest with `rustup target add`.
        include:
          - { target: x86_64-pc-windows-msvc, os: windows-latest, ext: zip }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm, ext: zip }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04, ext: tar.gz }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, ext: tar.gz }
          - { target: x86_64-apple-darwin, os: macos-15-intel, ext: tar.gz }
          - { target: aarch64-apple-darwin, os: macos-latest, ext: tar.gz }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: "0"
      # Explicit so the staging step knows the path without parsing metadata.
      CARGO_TARGET_DIR: target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - name: Tag matches the crate version
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "Tag $RELEASE_TAG does not match Cargo.toml version $version" >&2
            exit 1
          fi
      # rust-toolchain.toml pins the toolchain; this installs it. No sccache
      # here: tag builds are rare and must not depend on a cache service.
      - run: rustup show active-toolchain
      - name: Release build and test
        run: |
          cargo build --release --locked
          cargo test --release --locked
      - name: Stage package
        run: |
          set -euo pipefail
          v="${RELEASE_TAG#v}"
          dir="crabfarm-$v-${{ matrix.target }}"
          exe=crabfarm
          case "${{ matrix.target }}" in *windows*) exe=crabfarm.exe ;; esac
          mkdir -p "dist/$dir"
          cp "target/release/$exe" "dist/$dir/"
          # The node without a console window (autostart and the installer start it).
          cp "target/release/${exe/crabfarm/crabfarmd}" "dist/$dir/"
          cp LICENSE README.md "dist/$dir/"
          echo "PKG_DIR=$dir" >> "$GITHUB_ENV"
      - name: Archive (tar.gz)
        if: matrix.ext == 'tar.gz'
        run: tar -C dist -czf "dist/$PKG_DIR.tar.gz" "$PKG_DIR"
      - name: Archive (zip)
        if: matrix.ext == 'zip'
        shell: pwsh
        run: Compress-Archive -Path "dist/$env:PKG_DIR" -DestinationPath "dist/$env:PKG_DIR.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: dist/*.${{ matrix.ext }}
          if-no-files-found: error

  # Windows setup (per-user installer) and install.sh, built from the same tag.
  # The installer lifecycle itself runs in ci.yml; here it is only built and
  # then installed and removed once more by the same test, on this runner.
  installer:
    name: windows setup
    needs: [verify]
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - run: rustup show active-toolchain
      - name: Fetch the pinned NSIS
        shell: pwsh
        run: |
          $nsis = ./scripts/fetch-nsis.ps1 -Destination "$env:RUNNER_TEMP/nsis"
          "CRABFARM_MAKENSIS=$nsis" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build the setup
        shell: pwsh
        run: |
          $v = "$env:RELEASE_TAG".TrimStart('v')
          ./scripts/package.ps1 -Version $v -Jobs 4
          "PKG_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Test the setup (install, reinstall, uninstall)
        shell: pwsh
        run: ./scripts/test-installer.ps1 -Setup "artifacts/installer/crabfarm-$env:PKG_VERSION-setup.exe" -Version $env:PKG_VERSION
      - name: Stage files
        shell: bash
        run: |
          mkdir -p dist
          cp "artifacts/installer/crabfarm-$PKG_VERSION-setup.exe" dist/
          cp scripts/install.sh dist/install.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-setup
          path: dist/*
          if-no-files-found: error

  # Signed build provenance for every archive (GitHub artifact attestations).
  # The OIDC and attestation permissions live in this job only.
  attest:
    name: build provenance
    needs: [build, installer]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/crabfarm-*
            dist/install.sh

  draft:
    name: draft release (owner publishes)
    needs: [verify, build, installer, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Create or refresh the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          # One checksum file over every package.
          (cd dist && sha256sum crabfarm-* install.sh > SHA256SUMS.txt && cat SHA256SUMS.txt)
          awk -v v="$version" '$0 ~ "^## "v"[[:space:]]*$" {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md || true
          {
            echo
            echo "**Install:** on Windows run the \`-setup.exe\` (per user, no admin rights); on macOS and Linux run \`sh install.sh\` (or unpack the archive for your platform and put \`crabfarm\` and \`crabfarmd\` on your PATH); or run \`cargo install crabfarm\`. Guide: https://crabfarm.renner.dev/guide.html"
            echo "Check every download against SHA256SUMS.txt, or verify its provenance with \`gh attestation verify <archive> --repo $GH_REPO\`."
          } >> notes.md
          flags=(--draft --verify-tag --title "crabfarm $RELEASE_TAG" --notes-file notes.md)
          case "$RELEASE_TAG" in *-*) flags+=(--prerelease) ;; esac
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # Never touch a published release; refresh only a draft.
            if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "Release $RELEASE_TAG is already published; nothing changed." >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* "${flags[@]}"
          fi
          echo "Draft ready: the owner publishes it on GitHub."
