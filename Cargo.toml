[package]
name = "crabfarm"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "Distributed rustc over a peer-to-peer farm of Windows, macOS and Linux machines"
license = "MIT"
repository = "https://github.com/rennerdo30/crabfarm"
homepage = "https://crabfarm.renner.dev"
readme = "README.md"
keywords = ["rust", "distributed", "compiler", "build", "cargo"]
categories = ["development-tools", "development-tools::build-utils"]
# Ship only what is needed to build and understand the crate: no briefs,
# no tests, no machine-local config, no pinned toolchain file.
include = [
    "/src/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/README.md",
    "/CHANGELOG.md",
    "/docs/DESIGN.md",
    "/docs/GETTING-STARTED.md",
]

[[bin]]
name = "crabfarm"
path = "src/main.rs"

# The node without a console window on Windows; the same as `crabfarm node`
# elsewhere (autostart and the installer start this one).
[[bin]]
name = "crabfarmd"
path = "src/bin/crabfarmd.rs"

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
chacha20poly1305 = "0.11.0"
clap = { version = "4.6.8", features = ["derive"] }
data-encoding = "2.11.1"
directories = "6.0.0"
jobserver = "0.1.35"
mdns-sd = "0.22.0"
postcard = { version = "1.1.3", features = ["use-std"] }
rand = "0.10.4"
rcgen = { version = "0.14.10", features = ["x509-parser"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
socket2 = "0.6.5"
subtle = "2.6.1"
thiserror = "2.0.21"
time = { version = "0.3", default-features = false }
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
tokio-util = "0.7.20"
toml = "1.2.1"
toml_edit = "0.25.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
if-addrs = "0.15"
walkdir = "2.5.0"
x509-parser = "0.18.1"
zstd = "0.14.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[dev-dependencies]
tempfile = "3.27.0"
