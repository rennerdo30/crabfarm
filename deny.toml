# cargo-deny configuration. CI runs `cargo deny check licenses advisories
# sources` (job "cargo-deny"). `bans` is not checked.
#
# licenses: crabfarm ships only permissively licensed dependencies. For
# "A OR B" expressions one allowed side is enough.

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]
# option-ext (pulled in by directories -> dirs-sys) is MPL-2.0: file-level
# copyleft, used unmodified, so it is allowed for that one crate only.
exceptions = [
    { allow = ["MPL-2.0"], crate = "option-ext" },
]

# RustSec advisories: a known vulnerability fails the check. Yanked crates are
# reported (a yanked version in Cargo.lock needs a `cargo update -p`, not a
# red CI on an unrelated change).
[advisories]
version = 2
yanked = "warn"

# Dependencies come from crates.io only: no other registry, no git sources.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
